<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALES CRM — Hệ thống Anh ngữ ALES</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f4f4f1; --panel:#ffffff;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --good-ink:#006300;
  --b100:#cde2fb; --b250:#86b6ef; --b350:#5598e7; --b450:#2a78d6; --b550:#1c5cab; --b650:#104281;
  --brand:#c8102e;
  --radius:10px; --shadow:0 1px 2px rgba(11,11,11,.06), 0 8px 24px rgba(11,11,11,.06);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d; --panel:#1f1f1e;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --good-ink:#0ca30c;
  --b100:#0d366b; --b250:#184f95; --b350:#256abf; --b450:#3987e5; --b550:#6da7ec; --b650:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--plane);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--axis);border-radius:6px}

.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:36px;height:36px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px}
.brand b{font-size:15px;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted)}
.nav{padding:6px;display:flex;flex-direction:column;gap:1px;overflow:auto}
.nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text-secondary);font-weight:500;font-size:13.5px}
.nav button:hover{background:var(--plane)}
.nav button.on{background:color-mix(in srgb,var(--s1) 12%,transparent);color:var(--s1);font-weight:650}
.nav .ico{width:18px;text-align:center;flex:none;opacity:.85}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--critical);color:#fff;border-radius:20px;padding:0 6px;font-weight:700}
.nav .cnt.warn{background:var(--warning);color:#3a2c00}
.side-foot{margin-top:auto;padding:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:30;background:var(--surface-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:9px 18px}
.top h1{font-size:16px;margin:0;font-weight:650;white-space:nowrap}
.search{flex:1;max-width:400px;position:relative}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:8px;background:var(--plane)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.5}
.who{display:flex;align-items:center;gap:8px;margin-left:auto}
.content{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.card-h h3{margin:0;font-size:13.5px;font-weight:650}
.card-h .sub,.sub{font-size:11.5px;color:var(--muted)}
.card-b{padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{padding:7px 9px;border:1px solid var(--border);border-radius:8px;background:var(--surface-1)}
select:focus,input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--s1) 45%,transparent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-1);cursor:pointer;font-weight:550}
.btn:hover{background:var(--plane)}
.btn.pri{background:var(--s1);border-color:var(--s1);color:#fff}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.dg{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,var(--border))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid var(--border);white-space:nowrap}
.chip.dg{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 45%,var(--border))}
.chip.ok{color:var(--good-ink);border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.chip.wn{color:#7a5600;background:color-mix(in srgb,var(--warning) 22%,transparent);border-color:color-mix(in srgb,var(--warning) 45%,var(--border))}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.tile .lab{font-size:11px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:25px;font-weight:700;margin-top:3px;letter-spacing:-.5px}
.tile .sub{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
.up{color:var(--good-ink);font-weight:650}.down{color:var(--critical);font-weight:650}

.tbl-wrap{overflow:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-1);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);z-index:2;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--plane);cursor:pointer}
tbody tr.sel{background:color-mix(in srgb,var(--s1) 8%,transparent)}
.name-cell{font-weight:600}
.sub-cell{font-size:11.5px;color:var(--muted)}
table td .name-cell,table td .sub-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
table td .row{flex-wrap:nowrap;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}

.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:236px;flex:none;display:flex;flex-direction:column;max-height:calc(100vh - 220px)}
.col-h{padding:9px 11px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--panel);border-radius:var(--radius) var(--radius) 0 0}
.col-h .t{display:flex;align-items:center;gap:7px;font-weight:650;font-size:12.5px}
.col-b{padding:7px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:70px}
.col.over .col-b{background:color-mix(in srgb,var(--s1) 7%,transparent)}
.kcard{background:var(--surface-1);border:1px solid var(--border);border-radius:9px;padding:8px 9px;cursor:grab;box-shadow:0 1px 2px rgba(11,11,11,.05)}
.kcard.drag{opacity:.4}
.kcard .kn{font-weight:650;font-size:12.5px}
.kcard .kr{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(11,11,11,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(680px,100%);background:var(--surface-1);border-left:1px solid var(--border);z-index:51;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.dr-b{padding:14px 16px 40px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:13px}
.kv .k{color:var(--muted)}
.tl-i{display:grid;grid-template-columns:24px 1fr;gap:10px;padding-bottom:13px;position:relative}
.tl-i:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--grid)}
.tl-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--plane);border:1px solid var(--border)}
.tl-m{font-size:11.5px;color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--grid);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.cal .hd{background:var(--panel);padding:6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
.cal .cell{background:var(--surface-1);min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px}
.cal .cell.off{background:var(--plane);opacity:.55}
.cal .cell.today .dnum{background:var(--s1);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center}
.dnum{font-size:11.5px;font-weight:650;color:var(--text-secondary)}
.ev{font-size:10.5px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--s1) 13%,transparent);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{background:color-mix(in srgb,var(--good) 16%,transparent)}
.ev.late{background:color-mix(in srgb,var(--critical) 16%,transparent)}
.ev.absent{background:color-mix(in srgb,var(--warning) 22%,transparent)}

.bar-row{display:grid;grid-template-columns:minmax(120px,190px) 1fr 70px;gap:10px;align-items:center;padding:3px 0;font-size:12.5px}
.bar-track{background:var(--grid);border-radius:4px;height:16px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .4s}
.cc-plot{display:flex;align-items:flex-end;gap:8px;height:160px;border-bottom:1px solid var(--axis);
  background:linear-gradient(var(--grid),var(--grid)) 0 0/100% 1px no-repeat,linear-gradient(var(--grid),var(--grid)) 0 50%/100% 1px no-repeat}
.cc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.cc-bar{width:66%;max-width:54px;min-height:2px;border-radius:4px 4px 0 0;background:var(--b450);transition:height .35s}
.cc-lab{font-size:11px;font-weight:650;color:var(--text-secondary);white-space:nowrap}
.cc-x{display:flex;gap:8px;padding-top:6px}
.cc-x span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.tooltip{position:fixed;z-index:80;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .12s;max-width:280px}
.tooltip.on{opacity:1}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text-primary);color:var(--plane);padding:9px 16px;border-radius:20px;z-index:90;opacity:0;transition:.2s;font-weight:550;font-size:13px}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tabs button{background:none;border:0;padding:8px 10px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13px}
.tabs button.on{color:var(--s1);border-bottom-color:var(--s1)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}
@media(max-width:820px){.app{grid-template-columns:1fr}.side{position:static;height:auto}.nav{flex-direction:row;flex-wrap:wrap}.nav .grp{display:none}}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:9px 14px;border-top:1px solid var(--border);font-size:12.5px}
.warnbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:9px;background:color-mix(in srgb,var(--warning) 16%,transparent);border:1px solid color-mix(in srgb,var(--warning) 45%,var(--border));font-size:13px}
.warnbar.info{background:color-mix(in srgb,var(--s1) 10%,transparent);border-color:color-mix(in srgb,var(--s1) 35%,var(--border))}
.warnbar.dg{background:color-mix(in srgb,var(--critical) 12%,transparent);border-color:color-mix(in srgb,var(--critical) 40%,var(--border))}
.count72{font-variant-numeric:tabular-nums;font-weight:700}
.rub-row{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--grid)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface-1);border:0;padding:5px 11px;cursor:pointer;font-weight:650;font-size:12.5px;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--s1);color:#fff}
.note-box{background:var(--plane);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--text-secondary);margin-top:6px}
.ai-box{border:1px solid color-mix(in srgb,var(--s5) 40%,var(--border));background:color-mix(in srgb,var(--s5) 8%,transparent);border-radius:10px;padding:12px 14px}
.ai-box h4{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px}
.prog{height:8px;background:var(--grid);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--s1)}
@media print{.side,.top,.tabs,.btn{display:none!important}.app{display:block}.content{padding:0}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">ALES</div>
      <div><b>ALES CRM</b><span>Hệ thống Anh ngữ ALES</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Bản dựng thử · dữ liệu mẫu<br>Lưu trên trình duyệt của bạn</div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="page-title">Tổng quan</h1>
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Tìm học viên, phụ huynh, SĐT, mã KH…">
      </div>
      <div class="who">
        <select id="userSel" title="Đăng nhập dưới vai trò"></select>
        <button class="btn sm" id="themeBtn" title="Sáng / tối">◐</button>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="tooltip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>

const RUBRIC={"IELTS": {"groups": [{"group": "Fluency and Coherence/ Phản xạ và độ lưu loát", "criteria": [{"name": "Avoid silence or hesitation? Tránh được sự im lặng và do dự khi nói", "levels": {"1": "Học viên chưa tự tin, chưa chủ động tương tác với giáo viên.", "2": "Học viên khá tự tin, đôi chỗ còn e dè nhưng có chủ động tương tác khi được cô hướng dẫn, tuy nhiên còn gián đoạn nhiều", "3": "Học viên tự tin, làm chủ được phần giao tiếp với giáo viên nhưng câu trả lời còn ngắn và còn gián đoạn 1 số chỗ", "4": "Học viên rất tự tin, làm chủ phần giao tiếp với câu trả lời dài, trôi chảy và gần như không có sự gián đoạn"}}, {"name": "Use English only / Chỉ sử dụng tiếng Anh.", "levels": {"1": "Học viên có sử dụng tiếng Anh nhưng đa số vẫn cần cô giải thích thêm bằng tiếng Việt.", "2": "Học viên sử dụng tiếng Anh khá thường xuyên, cần giáo viên dịch sang tiếng Việt ở những câu khó.", "3": "Học viên sử dụng tiếng Anh thường xuyên, rất ít khi phải dịch sang tiếng Việt để hiểu.", "4": "Học viên sử dụng tiếng Anh linh hoạt, hiểu hết các câu và không cần dịch."}}, {"name": "Use correct words to express ideas? / Sử dụng từ hợp ngữ cảnh để diễn đạt ý", "levels": {"1": "Học viên hiểu và sử dụng từ vựng cơ bản nhưng còn ở mức độ yếu.", "2": "Học viên hiểu và biết sử dụng từ vựng cơ bản để trả lời.", "3": "Học viên hiểu và sử dụng từ vựng cơ bản khá linh hoạt, phù hợp ngữ cảnh để trả lời.", "4": "Học viên hiểu và sử dụng được từ vựng nâng cao, phù hợp ngữ cảnh để trả lời."}}]}, {"group": "Lexical Resources/ Từ vựng", "criteria": [{"name": "Use a wide range of vocabulary? / Sử dụng vốn từ vựng đa dạng", "levels": {"1": "Học viên có vốn từ vựng còn rất ít.", "2": "Học viên có vốn từ vựng hằng ngày ở mức cơ bản.", "3": "Học viên có vốn từ vựng hằng ngày khá tốt.", "4": "Học viên có vốn từ vựng nâng cao và đa dạng."}}, {"name": "Use the synonym or paraphrase / Sử dụng từ đồng nghĩa và biết cách diễn đạt lại ý theo cách riêng của mình", "levels": {"1": "Học viên mới chỉ lặp lại the       : daysOld < 30
        ? [["L1", 10], ["L2", 12], ["L3", 24], ["L4", 20], ["L5", 8], ["L6", 14], ["L7", 2], ["L8", 5], ["L9", 5]]
        : [["L1", 22], ["L2", 11], ["L3", 18], ["L4", 15], ["L5", 4], ["L6", 15], ["L7", 1], ["L8", 5], ["L9", 9]];
    const level = pickW(LV_W);

      ngaySinh: iso(new Date(2026 - (cap === "c1" ? ri(7, 11) : cap === "c2" ? ri(12, 15) : cap === "c3" ? ri(15, 18) : ri(19, 34)), ri(0, 11), ri(1, 28))),

    /* đặt lịch test khi tới L5 trở lên */

      const tester = pick(TESTERS);

      else { td = dAdd(cur, ri(1, 7)); if (td > TODAY) { const sp = Math.max(1, Math.round((TODAY - created) / 864e5)); td = dAdd(TODAY, -ri(0, Math.min(20, sp))); } }
      const ca = pick(caTrongNgay(td));
      const T = {
        id: "TS" + (5000 + TESTS.length), khId: k.id, testerId: tester.id, prog: k.chuongTrinh,
        date: iso(td), gio: ca, thietBi: pickW([["Máy tính", 78], ["Điện thoại", 18], ["Máy tính bảng", 4]]),
        status: done ? (rnd() < .12 ? "absent" : "done") : "booked",
        scores: {}, comments: {}, gvNhanXet: {}, wr: {}, re: null, li: null,
        total: null, band: null, lopDeXuat: null, video: "", phThamGia: rnd() < .6 ? 1 : 0, hrPhut: null, filledAt: null, saleId: owner
      };
      if (T.status === "done") {
        const R = RUBRIC[T.prog], mx = R.max;
        let tot = 0;
        R.groups.forEach((g, gi) => g.criteria.forEach((c, ci) => {
          const key = gi + "-" + ci;
          const base = prog_i >= 7 ? ri(2, mx) : ri(1, Math.max(2, mx - 1));
          T.scores[key] = base; tot += base;
          T.comments[key] = (c.levels[String(base)] || "").replace(/^Học viên/, k.hoTenHV.split(" ").slice(-2).join(" "));
        }));

          T.re = ri(2, 14); T.li = ri(2, 14);
          const wAvg = roundW(Object.values(T.wr).reduce((a, b) => a + b, 0) / 4);
          T.wrBand = wAvg; T.reBand = rlBand(T.re); T.liBand = rlBand(T.li);
          T.lopDeXuat = xepLopIELTS(T.band, T.wrBand, T.reBand, T.liBand);

      if (T.status === "done") k.acts.push({ t: T.date, type: "test", text: `Hoàn thành ca test — ${T.lopDeXuat}.`, by: tester.id });
    }

    if (level === "L7" || level === "L8") {

      const soDot = level === "L8" ? pickW([[1, 45], [2, 35], [3, 15], [4, 5]]) : pickW([[2, 45], [3, 35], [4, 20]]);
      const dots = []; let con = dt;

        con -= so;

        dots.push({ ngay: iso(dAdd(cur, d * 30)), soTien: so, daThu });
      }
      const mpos = rnd() < .18;
      const t2 = rnd() < .3 ? pick(teamSales).id : null;
      const O = {
        id: "DH" + (++oi), khId: k.id, code: C.code, giaGoc: C.goc, uuDai: C.uudai, doanhThu: dt,
        chietKhau: C.goc - dt, lechGia: lech !== 0, tuVan1: owner, tuVan2: t2, chia: t2 ? 50 : 100,
        hinhThuc: mpos ? "MPOS" : pick(["Chuyển khoản", "Chuyển khoản", "Tiền mặt"]), mpos,
        dots, createdAt: iso(cur), coso: k.coso, team: k.team,
        trangThai: rnd() < .25 ? "choDuyet" : "daDuyet",
        bills: rnd() < .85 ? ["bill-" + k.id + ".jpg"] : [],
        hopDong: pickW([["Chưa gửi", 25], ["Đã gửi - chờ ký", 30], ["Nhận HĐ giấy", 45]]),
        /* sau bán hàng */
        xepLop: pickW([["Cần order giáo viên", 35], ["Đã xếp lớp", 65]]),
        gv: null, lichHoc: "", ngayKG: null, cskh: null,
        qua: { taiNghe: { tang: C.tainghe, diaChi: "", daGiao: rnd() < .6 ? 1 : 0 }, giaSu: C.gs, gvnn: 6, ontap: 6 }
      };
      if (O.xepLop === "Đã xếp lớp") {
        O.gv = pick(GIAOVIEN);
        O.lichHoc = pick(["T2 + T4 : 19h00–21h00", "T3 + T5 : 19h50–21h50", "T5 + T7 : 18h00–20h00", "Sáng T7 + CN : 9h–11h", "T2-T4-T6 : 20h–21h30"]);
        O.ngayKG = iso(dAdd(new Date(O.createdAt), ri(3, 14)));
        O.cskh = pick(usersBy("cskh")).id;
      }
      ORDERS.push(O); k.orders.push(O.id);
      k.acts.push({ t: O.createdAt, type: "money", text: `Chốt đơn ${O.id} — ${C.code} · ${fmtVND(dt)} · ${soDot} đợt.`, by: owner });
    }
    if (level === "L9") { k.lyDoBo = pick(LYDO_BO); cur = dAdd(cur, ri(3, 20)); if (cur > TODAY) cur = dAdd(TODAY, -ri(1, 4)); k.acts.push({ t: iso(cur), type: "note", text: "Đóng hồ sơ — " + k.lyDoBo, by: owner }); }
    /* thêm vài note */
    for (let x = 0, m = ri(0, 3); x < m; x++) {
      const t3 = dAdd(new Date(k.createdAt), ri(1, Math.max(2, daysOld)));
      if (t3 <= TODAY) k.acts.push({ t: iso(t3), type: pickW([["call", 5], ["zalo", 4], ["note", 2]]), text: pick(NOTE_MAU), by: owner });
    }
    const tMax = iso(TODAY);
    k.acts.forEach(a => { if (a.t > tMax) a.t = tMax; if (a.t < k.createdAt) a.t = k.createdAt; });
    k.acts.sort((a, b) => a.t.localeCompare(b.t));
    k.lastAct = k.acts[k.acts.length - 1].t;
    if (OPEN_LV.includes(level)) {
      const off = rnd() < .2 ? -ri(1, 12) : ri(0, 10);
      k.next = {
        date: iso(dAdd(TODAY, off)),
        type: level === "L5" ? "test" : level === "L6" ? "meet" : pick(["call", "zalo"]),
        note: level === "L1" ? "Data tồn — gọi khai thác lại" : level === "L2" ? "Gọi lần đầu, xác nhận nhu cầu"
          : level === "L3" ? "Chốt lịch test đầu vào" : level === "L4" ? "Thuyết phục đặt lịch test"
            : level === "L5" ? "Nhắc khách đi test đúng giờ" : "Gửi phiếu kết quả + chốt gói"
      };
    }
    KH.push(k);
  }
  /* vài ca trùng SĐT để minh hoạ cảnh báo */
  for (let x = 0; x < 8; x++) { const a = KH[ri(0, KH.length - 1)], b = KH[ri(0, KH.length - 1)]; if (a !== b) b.phone = a.phone; }
  /* một ít khách trong Kho (nhân viên nghỉ việc) */
  KH.filter(x => x.level === "L1" || x.level === "L2").slice(0, 120).forEach(x => { if (rnd() < .35) { x.kho = 1; x.owner = null; } });

/* ---- phạm vi xem theo vai trò ---- */
function scope() {
  const r = myRole(), u = me();
  if (r === "sales") return KH.filter(k => k.owner === u.id);
  if (r === "ql") return KH.filter(k => k.team === u.team);
  if (r === "cskh") return KH.filter(k => k.orders.length);
  return KH;
}
function myTests() {
  const u = me();
  if (myRole() === "tester") return TESTS.filter(t => t.testerId === u.id);
  const ids = new Set(scope().map(k => k.id));
  return TESTS.filter(t => ids.has(t.khId));
}
function myOrders() {
  const ids = new Set(scope().map(k => k.id));
  return ORDERS.filter(o => ids.has(o.khId));
}

/* ---- 72h thời gian vàng ---- */
function golden(khId) {
  const ts = TESTS.filter(t => t.khId === khId && t.status === "done").sort((a, b) => b.date.localeCompare(a.date));
  if (!ts.length) return null;
  const t = ts[0];
  const end = new Date(t.date + "T" + (t.gio || "19:00") + ":00"); end.setHours(end.getHours() + 72);
  const left = Math.round((end - TODAY) / 36e5);
  return { test: t, left, alive: left > 0 };
}

/* ---- việc hôm nay & cảnh báo ---- */
function viecHomNay() {

  if (r === "ketoan") return ORDERS.filter(o => o.trangThai === "choDuyet");
  if (r === "hr" || r === "daotao") return ORDERS.filter(o => o.xepLop !== "Đã xếp lớp");
  if (r === "cskh") return ORDERS.filter(o => o.xepLop === "Đã xếp lớp" && !o.qua.taiNghe.daGiao);
  return scope().filter(k => k.next && k.next.date <= iso(TODAY) && OPEN_LV.includes(k.level))

}
function caCuaToi() { const u = me(); return TESTS.filter(t => t.testerId === u.id).sort((a, b) => (a.date + a.gio).localeCompare(b.date + b.gio)); }
const quaHan = k => k.next ? Math.round((TODAY - new Date(k.next.date)) / 864e5) : 0;

function alerts() {
  const r = myRole(), out = [];
  const add = (sev, ico, text, act) => out.push({ sev, ico, text, act });
  if (["sales", "ql", "admin"].includes(r)) {

    if (t.length) add("info", "▣", `${t.length} ca test hôm nay cần nhắc khách`, () => { S.view = "lichtest"; render(); });
  }
  if (["ketoan", "admin"].includes(r)) {
    const cd = ORDERS.filter(o => o.trangThai === "choDuyet");
    if (cd.length) add("wn", "✔", `${cd.length} đơn chờ kế toán duyệt`, () => { S.view = "duyet"; render(); });
    const nb = ORDERS.filter(o => !o.bills.length);
    if (nb.length) add("dg", "🧾", `${nb.length} đơn chưa có ảnh bill chuyển khoản`, () => { S.view = "duyet"; render(); });
    const hd = ORDERS.filter(o => o.hopDong === "Chưa gửi");
    if (hd.length) add("wn", "📄", `${hd.length} đơn chưa gửi hợp đồng`, () => { S.view = "donhang"; render(); });
    const dueDots = ORDERS.flatMap(o => o.dots.filter(d => !d.daThu && d.ngay <= iso(dAdd(TODAY, 3))));
    if (dueDots.length) add("dg", "💰", `${dueDots.length} đợt học phí đến hạn hoặc quá hạn`, () => { S.view = "congno"; render(); });
  }
  if (["hr", "daotao", "admin"].includes(r)) {
    const q = ORDERS.filter(o => o.xepLop !== "Đã xếp lớp");
    const tre = q.filter(o => daysSince(o.createdAt) > 7);
    if (tre.length) add("dg", "🎓", `${tre.length} ca xếp lớp đã quá 7 ngày`, () => { S.view = "xeplop"; render(); });
    else if (q.length) add("wn", "🎓", `${q.length} ca đang chờ xếp lớp`, () => { S.view = "xeplop"; render(); });
    const kg = ORDERS.filter(o => o.ngayKG && o.ngayKG >= iso(TODAY) && o.ngayKG <= iso(dAdd(TODAY, 7)));
    if (kg.length) add("info", "🔔", `${kg.length} lớp khai giảng trong 7 ngày tới`, () => { S.view = "xeplop"; render(); });
  }
  if (["cskh", "admin"].includes(r)) {
    const tn = ORDERS.filter(o => o.xepLop === "Đã xếp lớp" && !o.qua.taiNghe.daGiao);
    if (tn.length) add("wn", "🎁", `${tn.length} học viên chưa nhận tai nghe`, () => { S.view = "cskh"; render(); });
  }
  if (r === "tester") {
    const chua = caCuaToi().filter(t => t.date <= iso(TODAY) && t.status !== "cancel" && t.status !== "absent" && !t.filledAt);
    if (chua.length) add("dg", "📝", `${chua.length} ca test chưa nhập kết quả — ca điền thiếu sẽ không được tính công`, () => { S.view = "cacuatoi"; render(); });
    const hn = caCuaToi().filter(t => t.date === iso(TODAY));
    if (hn.length) add("info", "🎧", `${hn.length} ca test của bạn hôm nay`, () => { S.view = "cacuatoi"; render(); });
  }
  if (["mkt", "admin"].includes(r)) {
    const chuaPB = KH.filter(k => !k.owner && !k.kho);
    if (chuaPB.length) add("wn", "👥", `${chuaPB.length} data chưa phân bổ cho sale`, () => { S.view = "kh"; S.f.owner = "none"; render(); });
  }
  return out;
}

/* ---- hiển thị ---- */
function avatar(u, size) { const s = size || 26; return `<span class="avatar" style="background:${u.color};width:${s}px;height:${s}px;font-size:${(s * .42).toFixed(0)}px">${esc(initials(u.name))}</span>`; }
function lvChip(id) { const l = lvOf(id); return `<span class="chip"><span class="dot" style="background:${l.color}"></span>${l.id} ${l.name}</span>`; }
function ownerCell(k) {
  if (!k.owner) return `<span class="chip dg">${k.kho ? "Trong kho" : "Chưa phân bổ"}</span>`;
  const u = userOf(k.owner);
  return `<div class="row" style="gap:7px;flex-wrap:nowrap">${avatar(u, 24)}<span class="name-cell">${esc(u.name)}</span></div>`;
}
const tenHV = k => k.hoTenHV + (k.lop ? ` · ${k.lop}` : "");

/* ---- biểu đồ ---- */
const TIP = () => $("#tip");
function bindTip(node, html) {
  node.addEventListener("mousemove", e => { const t = TIP(); t.innerHTML = html; t.classList.add("on"); t.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px"; t.style.top = (e.clientY - 10) + "px"; });
  node.addEventListener("mouseleave", () => TIP().classList.remove("on"));
}
function colChart(data, o) {
  o = o || {}; const max = Math.max(1, ...data.map(d => d.v));
  const w = el("div"); const plot = el("div", "cc-plot");
  data.forEach(d => {
    const col = el("div", "cc-col");
    if (o.labelTop) col.appendChild(el("div", "cc-lab", esc(o.fmtShort ? o.fmtShort(d.v) : d.v)));
    const bar = el("div", "cc-bar"); bar.style.height = Math.max(.8, d.v / max * 100 * (o.labelTop ? .88 : 1)) + "%";
    if (d.color) bar.style.background = d.color;
    col.appendChild(bar); bindTip(col, `<b>${esc(d.full || d.label)}</b><br>${esc(d.tip || d.v)}`); plot.appendChild(col);
  });
  const xs = el("div", "cc-x"); data.forEach(d => xs.appendChild(el("span", null, esc(d.label))));
  w.appendChild(plot); w.appendChild(xs); return w;
}
function barList(rows, o) {
  o = o || {}; const max = Math.max(1, ...rows.map(r => r.v)); const box = el("div");
  rows.forEach(r => {
    const row = el("div", "bar-row");
    row.innerHTML = `<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.label)}">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.v / max * 100).toFixed(1)}%;background:${r.color || "var(--b450)"}"></div></div>
      <div class="tnum" style="text-align:right;font-weight:600">${o.fmt ? o.fmt(r.v) : r.v}</div>`;
    if (r.tip) bindTip(row, r.tip);
    box.appendChild(row);
  });
  return box;
}
function pctBar(v, target) {
  const p = target ? Math.min(100, v / target * 100) : 0;
  const c = p >= 100 ? "var(--good)" : p >= 60 ? "var(--b450)" : "var(--warning)";
  return `<div class="prog"><i style="width:${p.toFixed(0)}%;background:${c}"></i></div><div class="sub tnum">${p.toFixed(0)}% của ${fmtM(target)}</div>`;
}

/* ---- kỳ & tháng ---- */
const kyOf = d => { const day = new Date(d).getDate(); return day <= 10 ? 1 : day <= 20 ? 2 : 3; };
const inMonth = (s, y, m) => { if (!s) return false; const d = new Date(s); return d.getFullYear() === y && d.getMonth() === m; };
function monthsBack(n) { const a = []; for (let i = n - 1; i >= 0; i--) { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - i, 1); a.push({ y: d.getFullYear(), m: d.getMonth(), label: "T" + (d.getMonth() + 1) }); } return a; }

/* ---- 21 chỉ số phễu ---- */
function chiSo(list, from, to) {
  const inR = s => s && (!from || s >= from) && (!to || s <= to);
  const dataMoi = list.filter(k => inR(k.createdAt));
  const ids = new Set(list.map(k => k.id));
  const ts = TESTS.filter(t => ids.has(t.khId));
  const os = ORDERS.filter(o => ids.has(o.khId));
  const datLich = ts.filter(t => inR(t.date));
  const den = datLich.filter(t => t.status === "done");
  const dk = os.filter(o => inR(o.createdAt));
  const dkTrongThang = dk.filter(o => { const k = khOf(o.khId); return k && inR(k.createdAt); });
  const dt = dk.reduce((s, o) => s + o.doanhThu, 0);
  const dtHoanPhi = dk.reduce((s, o) => s + o.dots.slice(1).filter(d => d.daThu).reduce((a, b) => a + b.soTien, 0), 0);
  const dtGT = dk.filter(o => (khOf(o.khId) || {}).source === "gioithieu").reduce((s, o) => s + o.doanhThu, 0);
  return {
    dataMoi: dataMoi.length,
    dungTep: dataMoi.filter(k => capOf(k.cap).dungTep).length,
    dungTinhVua: dataMoi.filter(k => laTinhVua(k.tinh)).length,
    datLich: datLich.length, den: den.length,
    dangKy: dk.length, dangKyTrongThang: dkTrongThang.length,
    doanhThu: dt, hoanPhi: dtHoanPhi, gioiThieu: dtGT,
    r_tep: dataMoi.length ? dataMoi.filter(k => capOf(k.cap).dungTep).length / dataMoi.length : 0,
    r_vua: dataMoi.length ? dataMoi.filter(k => laTinhVua(k.tinh)).length / dataMoi.length : 0,
    r_datlich: dataMoi.length ? datLich.length / dataMoi.length : 0,
    r_den: datLich.length ? den.length / datLich.length : 0,
    r_dk: den.length ? dk.length / den.length : 0,
    tlcd: dataMoi.length ? dk.length / dataMoi.length : 0
  };
}
const pct = v => (v * 100).toFixed(1) + "%";
function cmpChuan(v, chuan) {
  if (!chuan) return "";
  return v >= chuan ? `<span class="chip ok">đạt chuẩn ${pct(chuan)}</span>` : `<span class="chip dg">dưới chuẩn ${pct(chuan)}</span>`;
}

function filtered() {
  let a = scope().filter(k => !k.kho);
  const q = S.q.trim().toLowerCase();
  if (q) a = a.filter(k => (k.hoTenHV + " " + k.hoTenPH + " " + k.phone + " " + k.id + " " + k.email).toLowerCase().includes(q));
  const f = S.f;
  if (f.level) a = a.filter(k => f.level === "open" ? OPEN_LV.includes(k.level) : k.level === f.level);
  if (f.source) a = a.filter(k => k.source === f.source);
  if (f.tep) a = a.filter(k => k.tep === f.tep);
  if (f.cap) a = a.filter(k => k.cap === f.cap);
  if (f.vua) a = a.filter(k => f.vua === "1" ? laTinhVua(k.tinh) : !laTinhVua(k.tinh));
  if (f.team) a = a.filter(k => k.team === f.team);
  if (f.owner) a = a.filter(k => f.owner === "none" ? !k.owner : k.owner === f.owner);
  if (f.when !== "all") a = a.filter(k => daysSince(k.createdAt) <= +f.when);
  return a.sort((x, y) => y.createdAt.localeCompare(x.createdAt));
}

function moveLevel(id, to) {

  k.acts.push({ t: iso(TODAY), type: "stage", text: `Đổi trạng thái: ${from} → ${to} ${lvOf(to).name}`, by: S.me });

  toast(`${k.hoTenHV} → ${to} ${lvOf(to).name}`); render();

}

function datLichNhanh() {

  const os = ORDERS.filter(o => o.xepLop === "Đã xếp lớp");
  const chuaGiao = os.filter(o => !o.qua.taiNghe.daGiao);
  const tiles = el("div", "tiles");
  tiles.innerHTML = `
    <div class="tile"><div class="lab">Học viên đang theo dõi</div><div class="val">${os.length}</div></div>
    <div class="tile"><div class="lab">Chưa giao tai nghe</div><div class="val" style="color:var(--warning)">${chuaGiao.length}</div></div>
    <div class="tile"><div class="lab">Buổi gia sư đã cam kết</div><div class="val">${os.reduce((s, o) => s + o.qua.giaSu, 0)}</div><div class="sub">theo gói học</div></div>
    <div class="tile"><div class="lab">Khai giảng hôm nay</div><div class="val">${os.filter(o => o.ngayKG === iso(TODAY)).length}</div></div>`;
  v.appendChild(tiles);

  const c = el("div", "card");
  c.innerHTML = `<div class="card-h"><div><h3>Bàn giao CSKH &amp; quà tặng theo gói</h3><div class="sub">Quà do gói học quyết định — hệ thống tự gắn khi chốt đơn</div></div></div>`;
  const wrap = el("div", "tbl-wrap"); const t = el("table");
  t.innerHTML = `<thead><tr><th>Học viên</th><th>Khoá</th><th>Khai giảng</th><th>Giáo viên</th><th>Tai nghe</th><th>Gia sư bổ trợ</th><th>06 buổi GVNN</th><th>CSKH</th><th></th></tr></thead>`;
  const tb = el("tbody");
  os.slice(0, 100).forEach(o => {
    const k = khOf(o.khId) || {};
    const tr = el("tr");
    tr.innerHTML = `<td class="name-cell">${esc(k.hoTenHV || "")}<div class="sub-cell tnum">${esc(k.phone || "")}</div></td>
      <td><b>${o.code}</b></td><td>${fmtD(o.ngayKG)}</td><td class="sub-cell">${esc(o.gv || "—")}</td>
      <td>${o.qua.taiNghe.daGiao ? '<span class="chip ok">đã giao</span>' : '<span class="chip wn">chưa giao</span>'}</td>
      <td>${o.qua.giaSu} buổi</td><td>${o.qua.gvnn} buổi</td>
      <td class="sub-cell">${esc(userOf(o.cskh).name)}</td><td style="text-align:right"></td>`;
    if (!o.qua.taiNghe.daGiao) {
      const b = el("button", "btn ok sm", "Đánh dấu đã giao");
      b.onclick = e => { e.stopPropagation(); o.qua.taiNghe.daGiao = 1; toast("Đã ghi nhận giao tai nghe"); render(); };
      tr.lastElementChild.appendChild(b);
    }
    tr.onclick = () => openKH(o.khId, "lop"); tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap);
  v.appendChild(c);
}

/* ---------- NHẬT KÝ CHĂM SÓC ---------- */
function viewNhatKy(v) {
  const day = iso(TODAY);
  const bar = el("div", "card"); const bb = el("div", "card-b row");
  const dt = el("input"); dt.type = "date"; dt.value = S.nkDay || day;
  dt.onchange = () => { S.nkDay = dt.value; render(); };
  bb.appendChild(el("span", "sub", "Ngày")); bb.appendChild(dt);
  bb.appendChild(el("div", "grow"));
  bar.appendChild(bb); v.appendChild(bar);
  const d = S.nkDay || day;
  const pool = myRole() === "sales" ? [me()] : myRole() === "ql" ? SALES.filter(s => s.team === me().team) : SALES;

  const rows = pool.map(u => {
    const acts = KH.filter(k => k.owner === u.id).flatMap(k => k.acts.filter(a => a.t === d).map(a => ({ a, k })));
    return {
      u, acts,
      call: acts.filter(x => x.a.type === "call").length, zalo: acts.filter(x => x.a.type === "zalo").length,
      note: acts.filter(x => x.a.type === "note").length,
      khach: new Set(acts.map(x => x.k.id)).size,
      boQuen: KH.filter(k => k.owner === u.id && OPEN_LV.includes(k.level) && quaHan(k) > 0).length
    };
  }).sort((a, b) => b.acts.length - a.acts.length);

  const c = el("div", "card");
  c.innerHTML = `<div class="card-h"><div><h3>Nhật ký chăm sóc ngày ${fmtD(d)}</h3><div class="sub">Số cuộc gọi / tin nhắn / ghi chú của từng sale</div></div></div>`;
  const wrap = el("div", "tbl-wrap"); const t = el("table");
  t.innerHTML = `<thead><tr><th>Sale</th><th>Team</th><th style="text-align:right">☎ Gọi</th><th style="text-align:right">💬 Zalo</th><th style="text-align:right">🗒 Ghi chú</th><th style="text-align:right">Tổng</th><th style="text-align:right">Khách đã chạm</th><th style="text-align:right">Bỏ quên</th></tr></thead>`;
  const tb = el("tbody");
  rows.forEach(r => {
    const tr = el("tr");
    tr.innerHTML = `<td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(r.u, 26)}<b>${esc(r.u.name)}</b></div></td>
      <td class="sub-cell">${esc(teamOf(r.u.team).name)}</td>
      <td class="tnum" style="text-align:right">${r.call}</td><td class="tnum" style="text-align:right">${r.zalo}</td>
      <td class="tnum" style="text-align:right">${r.note}</td><td class="tnum" style="text-align:right;font-weight:700">${r.acts.length}</td>
      <td class="tnum" style="text-align:right">${r.khach}</td>
      <td class="tnum" style="text-align:right;${r.boQuen ? "color:var(--critical);font-weight:650" : ""}">${r.boQuen}</td>`;
    tr.onclick = () => { S.nkUser = r.u.id; render(); };
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap);
  v.appendChild(c);

  const uid = S.nkUser || (rows[0] && rows[0].u.id);
  const detail = rows.find(r => r.u.id === uid);
  if (detail) {
    const c2 = el("div", "card");
    c2.innerHTML = `<div class="card-h"><div><h3>Chi tiết ghi chú — ${esc(detail.u.name)}</h3><div class="sub">${detail.acts.length} lượt trong ngày ${fmtD(d)}</div></div></div>`;
    const b2 = el("div"); b2.style.padding = "4px 14px 12px";
    if (!detail.acts.length) b2.appendChild(el("div", "empty", "Chưa có ghi chú nào trong ngày này."));
    detail.acts.forEach(x => {
      const row = el("div", "row");
      row.style.cssText = "padding:8px 0;border-bottom:1px solid var(--grid);flex-wrap:nowrap;gap:10px;cursor:pointer";
      row.innerHTML = `<span style="width:22px">${ACT[x.a.type] || "•"}</span>
        <div style="min-width:0;flex:1"><div class="name-cell">${esc(x.k.hoTenHV)} <span class="muted" style="font-weight:400">· ${esc(x.k.phone)}</span></div>
        <div class="sub-cell" style="white-space:normal">${esc(x.a.text)}</div></div>${lvChip(x.k.level)}`;
      row.onclick = () => openKH(x.k.id, "log");
      b2.appendChild(row);
    });
    c2.appendChild(b2); v.appendChild(c2);
  }
}

/* ---------- CÔNG TESTER ---------- */
function viewCongTester(v) {
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const list = (myRole() === "tester" ? [me()] : TESTERS).map(u => {
    const ts = TESTS.filter(t => t.testerId === u.id && inMonth(t.date, y, m));
    const done = ts.filter(t => t.filledAt);
    const thieu = ts.filter(t => t.date <= iso(TODAY) && t.status !== "cancel" && t.status !== "absent" && !t.filledAt);
    const dk = done.filter(t => { const k = khOf(t.khId); return k && k.orders.length; });
    const cong = done.reduce((s, t) => s + progOf(t.prog).cong, 0);
    return { u, ts, done, thieu, dk, cong, tl: done.length ? dk.length / done.length : 0 };
  }).sort((a, b) => b.tl - a.tl);

  const w = el("div", "warnbar info");
  w.innerHTML = `<span>🧮</span><span>Công tính theo ca đã điền đủ kết quả: <b>IELTS 60.000đ</b> · <b>Giao tiếp &amp; Kids 45.000đ</b>. Ca chưa nhập kết quả không được tính.</span>`;
  v.appendChild(w);

  const c = el("div", "card");
  c.innerHTML = `<div class="card-h"><div><h3>Công &amp; hiệu quả tester — tháng ${m + 1}/${y}</h3><div class="sub">Xếp theo tỷ lệ đăng ký / ca test</div></div></div>`;
  const wrap = el("div", "tbl-wrap"); const t = el("table");
  t.innerHTML = `<thead><tr><th style="width:34px">#</th><th>Tester</th><th>Mã GV</th><th style="text-align:right">Ca nhận</th><th style="text-align:right">Đã nhập KQ</th><th style="text-align:right">Thiếu KQ</th><th style="text-align:right">Ca ra đơn</th><th style="text-align:right">Tỷ lệ ĐK/test</th><th style="text-align:right">Công tạm tính</th></tr></thead>`;
  const tb = el("tbody");
  list.forEach((r, i) => {
    const tr = el("tr");
    tr.innerHTML = `<td class="tnum muted">${i + 1}</td>
      <td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(r.u, 26)}<b>${esc(r.u.name)}</b></div></td>
      <td>${esc(r.u.gv || "")}</td>
      <td class="tnum" style="text-align:right">${r.ts.length}</td>
      <td class="tnum" style="text-align:right">${r.done.length}</td>
      <td class="tnum" style="text-align:right;${r.thieu.length ? "color:var(--critical);font-weight:650" : ""}">${r.thieu.length}</td>
      <td class="tnum" style="text-align:right">${r.dk.length}</td>
      <td class="tnum" style="text-align:right;font-weight:650">${pct(r.tl)}</td>
      <td class="tnum" style="text-align:right;font-weight:700">${fmtVND(r.cong)}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap);
  v.appendChild(c);
}

/* --- 21 chỉ số theo kỳ --- */
function bcPheu(v) {
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const d1 = iso(new Date(y, m, 1)), dEnd = iso(new Date(y, m + 1, 0));
  const list = scope();
  const ky = [
    { name: "KỲ I", from: iso(new Date(y, m, 1)), to: iso(new Date(y, m, 10)) },
    { name: "KỲ II", from: iso(new Date(y, m, 11)), to: iso(new Date(y, m, 20)) },
    { name: "KỲ III", from: iso(new Date(y, m, 21)), to: dEnd }
  ];
  const cols = [{ name: "TỔNG THÁNG", from: d1, to: dEnd }].concat(ky);
  const data = cols.map(c => ({ c, s: chiSo(list, c.from, c.to) }));

  const c = el("div", "card");
  c.innerHTML = `<div class="card-h"><div><h3>Báo cáo phễu tháng ${m + 1}/${y}</h3><div class="sub">Cùng bộ chỉ số như file Excel hiện tại — nhưng máy tự cộng từ dữ liệu khách, không ai phải gõ tay</div></div></div>`;
  const wrap = el("div", "tbl-wrap"); const t = el("table");
  t.innerHTML = `<thead><tr><th style="min-width:250px">Chỉ số</th>${data.map(d => `<th style="text-align:right">${d.c.name}</th>`).join("")}<th>So chuẩn</th></tr></thead>`;
  const tb = el("tbody");
  const R = (label, get, fmt, chuan) => {
    const tr = el("tr");
    const vals = data.map(d => get(d.s));
    tr.innerHTML = `<td class="name-cell">${label}</td>` + vals.map(x => `<td class="tnum" style="text-align:right">${fmt ? fmt(x) : x}</td>`).join("")
      + `<td>${chuan ? cmpChuan(vals[0], chuan) : ""}</td>`;
    tb.appendChild(tr);
  };
  R("Data mới", s => s.dataMoi);
  R("Data đúng tệp (PH có con cấp 2,3)", s => s.dungTep);
  R("Data đúng tỉnh Vua", s => s.dungTinhVua);
  R("Đặt lịch", s => s.datLich);
  R("Đến", s => s.den);
  R("Đăng ký của data trong tháng", s => s.dangKyTrongThang);
  R("Tổng đăng ký", s => s.dangKy);
  R("Doanh thu mới", s => s.doanhThu, fmtVND);
  R("Doanh thu hoàn phí (các đợt sau)", s => s.hoanPhi, fmtVND);
  R("Doanh thu giới thiệu", s => s.gioiThieu, fmtVND);
  R("Doanh thu tổng", s => s.doanhThu + s.hoanPhi, fmtVND);
  R("Data đúng tệp / Tổng data", s => s.r_tep, pct);
  R("Data đúng tỉnh Vua / Tổng data", s => s.r_vua, pct);
  R("Đặt lịch / Data", s => s.r_datlich, pct, CHUAN.datlich_data);
  R("Đến / Đặt lịch", s => s.r_den, pct, CHUAN.den_datlich);
  R("Đăng ký / Đến", s => s.r_dk, pct, CHUAN.dangky_den);
  R("TLCĐ chung (Đăng ký / Tổng data)", s => s.tlcd, pct, TLCD.ca_nhan_aim);
  t.appendChild(tb); wrap.appendChild(t); c.appendChild(wrap); v.appendChild(c);

  const g = el("div", "grid2");
  const c1 = el("div", "card");
  c1.innerHTML = `<div class="card-h"><div><h3>Data mới theo tháng</h3></div></div>`;
  const b1 = el("div", "card-b");
  b1.appendChild(colChart(monthsBack(6).map(x => {
    const n = list.filter(k => inMonth(k.createdAt, x.y, x.m)).length;
    return { label: x.label, v: n, full: `Tháng ${x.m + 1}/${x.y}`, tip: n + " data mới" };
  }), { labelTop: true, fmtShort: x => x }));
  c1.appendChild(b1); g.appendChild(c1);

  const c2 = el("div", "card");
  c2.innerHTML = `<div class="card-h"><div><h3>Doanh thu theo tháng</h3></div></div>`;
  const b2 = el("div", "card-b");
  const os = myOrders();
  b2.appendChild(colChart(monthsBack(6).map(x => {
    const w = os.filter(o => inMonth(o.createdAt, x.y, x.m));
    const val = w.reduce((s, o) => s + o.doanhThu, 0);
    return { label: x.label, v: val, full: `Tháng ${x.m + 1}/${x.y}`, tip: `${fmtVND(val)} · ${w.length} HV` };
  }), { labelTop: true, fmtShort: fmtM }));
  c2.appendChild(b2); g.appendChild(c2);
  v.appendChild(g);
}

/* --- KPI --- */
function bcKPI(v) {
  const y = TODAY.getFullYear(), m = TODAY.getMonth();
  const d1 = iso(new Date(y, m, 1)), dE = iso(new Date(y, m + 1, 0));

  const teamRows = TEAMS.map(t => {
    const ks = KH.filter(k => k.team === t.id);
    const os = ORDERS.filter(o => o.team === t.id && inMonth(o.createdAt, y, m));
    const rev = os.reduce((s, o) => s + o.doanhThu, 0);
    const cs = chiSo(ks, d1, dE);
    return { t, rev, os, cs, pctT: t.target ? rev / t.target : 0 };
  }).sort((a, b) => b.rev - a.rev);

  const c0 = el("div", "card");
  c0.innerHTML = `<div class="card-h"><div><h3>KPI theo team — tháng ${m + 1}/${y}</h3><div class="sub">Mục tiêu team: TLCĐ tối thiểu ${pct(TLCD.team_min)} · phấn đấu ${pct(TLCD.team_aim)}</div></div></div>`;
  const w0 = el("div", "tbl-wrap"); const t0 = el("table");
  t0.innerHTML = `<thead><tr><th>Team</th><th>Cơ sở</th><th style="text-align:right">Doanh thu</th><th style="width:160px">Tiến độ chỉ tiêu</th><th style="text-align:right">Data</th><th style="text-align:right">Đặt lịch</th><th style="text-align:right">Đến</th><th style="text-align:right">Chốt</th><th style="text-align:right">TLCĐ</th></tr></thead>`;
  const tb0 = el("tbody");
  teamRows.forEach(r => {
    const tr = el("tr");
    tr.innerHTML = `<td class="name-cell">${esc(r.t.name)}</td><td class="sub-cell">${esc(cosoOf(r.t.coso).name)}</td>
      <td class="tnum" style="text-align:right;font-weight:700">${fmtM(r.rev)}</td>
      <td>${pctBar(r.rev, r.t.target)}</td>
      <td class="tnum" style="text-align:right">${r.cs.dataMoi}</td>
      <td class="tnum" style="text-align:right">${r.cs.datLich}</td>
      <td class="tnum" style="text-align:right">${r.cs.den}</td>
      <td class="tnum" style="text-align:right">${r.cs.dangKy}</td>
      <td class="tnum" style="text-align:right">${pct(r.cs.tlcd)} ${r.cs.tlcd >= TLCD.team_aim ? "🟢" : r.cs.tlcd >= TLCD.team_min ? "🟡" : "🔴"}</td>`;
    tb0.appendChild(tr);
  });
  t0.appendChild(tb0); w0.appendChild(t0); c0.appendChild(w0); v.appendChild(c0);

  const rows = SALES.map(u => {
    const ks = KH.filter(k => k.owner === u.id);
    const os = ORDERS.filter(o => (o.tuVan1 === u.id || o.tuVan2 === u.id) && inMonth(o.createdAt, y, m));
    const rev = os.reduce((s, o) => s + o.doanhThu * (o.tuVan2 ? (o.tuVan1 === u.id ? o.chia : 100 - o.chia) / 100 : 1), 0);
    const cs = chiSo(ks, d1, dE);
    const late = ks.filter(k => OPEN_LV.includes(k.level) && quaHan(k) > 0).length;
    return { u, rev, cs, late, target: u.target || 0 };
  }).sort((a, b) => b.rev - a.rev);

  const c1 = el("div", "card");
  c1.innerHTML = `<div class="card-h"><div><h3>KPI từng sale — tháng ${m + 1}/${y}</h3><div class="sub">Doanh thu đã chia theo tỉ lệ khi đơn có 2 người tư vấn · TLCĐ cá nhân tối thiểu ${pct(TLCD.ca_nhan_min)}, phấn đấu ${pct(TLCD.ca_nhan_aim)}</div></div></div>`;
  const w1 = el("div", "tbl-wrap"); const t1 = el("table");
  t1.innerHTML = `<thead><tr><th style="width:32px">#</th><th>Sale</th><th>Team</th><th style="text-align:right">Doanh thu</th><th style="width:150px">Tiến độ</th><th style="text-align:right">Data</th><th style="text-align:right">Đặt lịch</th><th style="text-align:right">Đến</th><th style="text-align:right">Chốt</th><th style="text-align:right">TLCĐ</th><th style="text-align:right">Đặt lịch/Data</th><th style="text-align:right">Quá hạn CS</th></tr></thead>`;
  const tb1 = el("tbody");
  rows.forEach((r, i) => {
    const tr = el("tr");
    const ok = r.cs.tlcd >= TLCD.ca_nhan_aim ? "🟢" : r.cs.tlcd >= TLCD.ca_nhan_min ? "🟡" : "🔴";
    tr.innerHTML = `<td class="tnum muted">${i + 1}</td>
      <td><div class="row" style="gap:8px;flex-wrap:nowrap">${avatar(r.u, 26)}<div><div class="name-cell">${esc(r.u.name)}</div><div class="sub-cell">${esc(roleOf(r.u.role).name)}</div></div></div></td>
      <td class="sub-cell">${esc(teamOf(r.u.team).name)}</td>
      <td class="tnum" style="text-align:right;font-weight:650">${fmtM(r.rev)}</td>
      <td>${pctBar(r.rev, r.target)}</td>
      <td class="tnum" style="text-align:right">${r.cs.dataMoi}</td>
      <td class="tnum" style="text-align:right">${r.cs.datLich}</td>
      <td class="tnum" style="text-align:right">${r.cs.den}</td>
      <td class="tnum" style="text-align:right">${r.cs.dangKy}</td>
      <td class="tnum" style="text-align:right">${pct(r.cs.tlcd)} ${ok}</td>
      <td class="tnum" style="text-align:right">${pct(r.cs.r_datlich)}</td>
      <td class="tnum" style="text-align:right;${r.late ? "color:var(--critical);font-weight:650" : ""}">${r.late}</td>`;
    tr.onclick = () => { S.me = r.u.id; drawUser(); S.view = "dash"; render(); };
    tb1.appendChild(tr);
  });
  t1.appendChild(tb1); w1.appendChild(t1); c1.appendChild(w1); v.appendChild(c1);
}

function tinhLai(T, R, k) {
  const n = R.groups.reduce((s, g) => s + g.criteria.length, 0);

    T.reBand = T.re == null ? null : rlBand(T.re);

  } else {
    const x = xepLopKhac(T.prog, tong); T.trinhDo = x.level; T.lopDeXuat = x.lop;
  }
}

  c.appendChild(cb); body.appendChild(c);
}

/* ============ GỢI Ý (AI) ============ */
function aiBox(title, html, T) {
  const box = el("div", "ai-box");
  box.innerHTML = `<h4>✨ ${esc(title)}</h4>${html}
    <div class="sub" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px">
      Bản dựng thử đang sinh gợi ý bằng công thức từ chính dữ liệu ca test. Khi nối API AI miễn phí (Google Gemini), phần này sẽ do AI viết lại thành lời tư vấn tự nhiên và bám sát từng khách.</div>`;
  return box;
}
function aiChot(k, T) {
  const g = golden(k.id);
  const R = RUBRIC[T.prog];
  const arr = [];
  R.groups.forEach((gr, gi) => gr.criteria.forEach((cr, ci) => arr.push({ g: gr.group, c: cr.name, s: T.scores[gi + "-" + ci] || 0 })));
  const yeu = arr.slice().sort((a, b) => a.s - b.s).slice(0, 3);
  const manh = arr.slice().sort((a, b) => b.s - a.s).slice(0, 2);
  const goiY = deXuatGoi(k, T);
  const phanDoi = [
    ["“Để chị bàn với gia đình đã”", "Chốt mốc thời gian cụ thể: “Em giữ suất quà tặng đến " + (g && g.alive ? `${g.left} giờ nữa` : "hết hôm nay") + " thôi ạ, chị cho em xin phản hồi trước lúc đó nhé.”"],
    ["“Học phí cao quá”", "Quy về đơn giá mỗi giờ học 1 kèm 1, và nhắc gói đã gồm " + (courseOf(goiY.code) || {}).gs + " buổi gia sư bổ trợ + tai nghe, tính ra rẻ hơn học nhóm mà con được kèm riêng."],
    ["“Con em bận, sợ không theo được”", "Đưa lịch rảnh của con vào phần xếp lớp — ALES xếp lớp theo lịch của học viên, không phải ngược lại."]
  ];
  return `
  <div class="kv">
    <div class="k">Kết quả test</div><div><b>${esc(T.lopDeXuat || "")}</b>${T.prog === "IELTS" ? ` · Speaking ${T.band} · Writing ${T.wrBand ?? "—"} · Reading ${T.reBand ?? "—"} · Listening ${T.liBand ?? "—"}` : ` · ${T.total} điểm`}</div>
    <div class="k">Mục tiêu gia đình</div><div>${esc(k.mucTieu)}</div>
    <div class="k">Thời gian vàng</div><div>${g ? (g.alive ? `<b style="color:var(--s2)">còn ${g.left} giờ</b> — quà tặng vẫn áp dụng` : "đã hết — không còn quà tặng") : "chưa test"}</div>
  </div>
  <div style="margin-top:10px"><b>1. Gói nên chào</b>
    <div class="note-box"><b>${goiY.code} — ${esc(goiY.ten)}</b><br>
    Doanh số ${fmtVND(goiY.goc)} → ưu đãi còn <b>${fmtVND(goiY.uudai)}</b> · ${goiY.gio}h (GVVN ${goiY.gvvn}h + GVNN ${goiY.gvnn}h)<br>
    Quà nếu chốt trong 72h: ${goiY.gs} buổi gia sư bổ trợ + ${goiY.tainghe} tai nghe gắn mic.<br>
    <span class="sub">${esc(goiY.lyDo)}</span></div></div>
  <div style="margin-top:10px"><b>2. Điểm nên nhấn khi nói chuyện</b>
    <div class="note-box">Khen trước — con đang tốt ở: ${manh.map(m => esc(vnName(m.c))).join(" · ")}.<br>
    Sau đó chỉ ra đúng 3 chỗ hổng: <b>${yeu.map(m => esc(vnName(m.c))).join(" · ")}</b> — đây chính là thứ lộ trình sẽ vá, và cũng là lý do cần kèm 1-1 thay vì học nhóm.</div></div>
  <div style="margin-top:10px"><b>3. Phụ huynh có thể phản đối gì</b>
    ${phanDoi.map(([q, a]) => `<div class="note-box"><b>${esc(q)}</b><br>${esc(a)}</div>`).join("")}</div>
  <div style="margin-top:10px"><b>4. Việc cần làm ngay</b>
    <div class="note-box">Gửi phiếu kết quả test qua Zalo trong hôm nay${T.video ? " kèm link video ca test để phụ huynh xem con học thật thế nào" : ""}.
    ${T.phThamGia ? "Phụ huynh đã dự ca test — nhắc lại đúng những gì cô giáo nhận xét lúc đó." : "Phụ huynh chưa dự ca test — nên gọi kể lại chi tiết, hoặc mời xem video."}</div></div>`;
}
function deXuatGoi(k, T) {
  const isKid = T.prog.startsWith("KIDS"), isGT = T.prog === "GT";
  let code, lyDo;
  if (isKid) {
    const lv = T.trinhDo || "Starters";
    code = lv === "Starters" ? "VPK1H_M96" : lv === "Movers" ? "VPK1H_F96" : "VPK1H_F50";
    lyDo = `Con đang ở mức ${lv} — nên chọn gói đưa con lên bậc kế tiếp thay vì học lại cùng bậc.`;
  } else if (isGT) {
    code = (T.trinhDo === "A1") ? "VP105_A2" : "VP105";
    lyDo = `Đầu vào ${T.trinhDo || "PreA1"} — gói 105h có giáo viên nước ngoài giúp bật phản xạ nhanh hơn gói 70h.`;
  } else {
    const b = T.band || 2;
    if (b < 2.5) { code = "MI42"; lyDo = "Speaking dưới 2.5 — thuộc nhóm mất gốc, cần gói xây nền từ đầu, cam kết 4.0–4.5 là mốc thực tế."; }
    else if (b < 3.5) { code = "MI5"; lyDo = "Đã có phản xạ cơ bản, đủ sức đặt mục tiêu 5.0–5.5 nếu học đủ 170h."; }
    else if (b < 4.5) { code = "I45"; lyDo = "Nền tảng khá — gói 60h đủ để đưa lên 5.0–5.5, chi phí nhẹ, dễ chốt."; }
    else { code = "I46"; lyDo = "Đầu vào tốt, nên đẩy thẳng mục tiêu 6.0–6.5 để kịp mốc thi."; }
    if ((k.mucTieu || "").match(/du học|học bổng/i)) lyDo += " Gia đình có mục tiêu du học nên band cần cao hơn mặt bằng — có thể chào lên một bậc gói.";
  }
  const C = courseOf(code) || COURSES[0];
  return { code: C.code, ten: C.nhom + " — " + C.name, goc: C.goc, uudai: C.uudai, gio: C.gio, gvvn: C.gvvn, gvnn: C.gvnn, gs: C.gs, tainghe: C.tainghe, lyDo };
}
function aiGiangDay(k, T, O) {
  const R = RUBRIC[T.prog];
  const arr = [];
  R.groups.forEach((gr, gi) => gr.criteria.forEach((cr, ci) => arr.push({ c: cr.name, s: T.scores[gi + "-" + ci] || 0, nx: T.comments[gi + "-" + ci] || "" })));
  const yeu = arr.slice().sort((a, b) => a.s - b.s).slice(0, 3);
  const C = courseOf(O.code) || {};
  return `
  <div class="kv">
    <div class="k">Học viên</div><div><b>${esc(k.hoTenHV)}</b> · ${esc(capOf(k.cap).name)}${k.lop ? " · " + esc(k.lop) : ""} · ${esc(k.tinh)}</div>
    <div class="k">Xếp lớp</div><div>${esc(T.lopDeXuat || "")}</div>
    <div class="k">Gói học</div><div>${O.code} · ${C.gio}h (GVVN ${C.gvvn}h + GVNN ${C.gvnn}h)</div>
    <div class="k">Mục tiêu gia đình</div><div>${esc(k.mucTieu)}</div>
  </div>
  <div style="margin-top:10px"><b>Ba việc cần làm ngay trong 3 buổi đầu</b>
    ${yeu.map((y, i) => `<div class="note-box"><b>${i + 1}. ${esc(vnName(y.c))}</b> — chấm ${y.s}/${R.max}<br><span class="sub">${esc(y.nx)}</span></div>`).join("")}</div>
  <div style="margin-top:10px"><b>Lưu ý về tính cách &amp; cách tiếp cận</b>
    <div class="note-box">${esc(T.gvNhanXet["Tính cách & sự tiếp thu"] || "Tester chưa ghi nhận — nên xem lại video ca test trước buổi đầu.")}
    ${T.video ? `<br>🎥 <a href="${esc(T.video)}" target="_blank">Xem lại ca test</a>` : ""}</div></div>
  <div style="margin-top:10px"><b>Mốc cần bám</b>
    <div class="note-box">Báo cáo tổng kết chặng <b>15 buổi/lần</b> theo mô hình 03 kèm 01. Cam kết đầu ra của gói: <b>${esc(C.name || "")}</b>.
    ${O.ngayKG ? `Khai giảng ${fmtD(O.ngayKG)} · lịch ${esc(O.lichHoc)}.` : ""}</div></div>`;
}
